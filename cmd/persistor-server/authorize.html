<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize · Persistor</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 28rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .muted { color: #666; font-size: 0.9rem; }
    #status { font-size: 0.85rem; color: #555; white-space: pre-wrap; margin-bottom: 1rem; }
    #status.err { color: #b00020; }
  </style>

  <!-- Pin a single instance of react / react-dom / @stytch/vanilla-js. @stytch/react
       takes all three as PEER deps; if esm.sh hands it a second copy of react the
       hooks throw "invalid hook call" and the widget renders blank. ?external= forces
       @stytch/react to import the bare specifiers, which this map resolves to the one
       copy. Versions are the known-good set from stytchauth/stytch-react-example
       (react 18.3.1 + @stytch/react 19.5.2 + @stytch/vanilla-js ^5). -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "@stytch/vanilla-js": "https://esm.sh/@stytch/vanilla-js@5.24.1",
      "@stytch/react": "https://esm.sh/@stytch/react@19.5.2?external=react,react-dom,@stytch/vanilla-js"
    }
  }
  </script>
</head>
<body>
  <h1>Authorize access to your Persistor memory</h1>
  <p class="muted">Sign in to approve this application's access to your memory.</p>
  <div id="status">Loading…</div>
  <div id="root"></div>

  <script type="module">
    // Stytch Connected Apps consent page — the OAuth "Authorization URL". Rendered
    // with Stytch's SUPPORTED React components (the vanilla-js mount* helpers are
    // deprecated and render an empty placeholder). Flow:
    //   1. No session  -> <StytchLogin> (email magic link).
    //   2. Magic-link return -> TokenAuthenticator authenticates the token, then
    //      reloads this same URL with the OAuth params intact (token stripped).
    //   3. Session present -> <IdentityProvider> reads client_id/redirect_uri/scope/
    //      state from the query string, shows consent, redirects back with a code.
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { StytchProvider, StytchLogin, IdentityProvider, useStytch, useStytchUser } from '@stytch/react';
    import { StytchUIClient, Products } from '@stytch/vanilla-js';

    const h = React.createElement;
    const statusEl = document.getElementById('status');
    const show = (msg, isErr) => { statusEl.textContent = msg || ''; statusEl.className = isErr ? 'err' : ''; };
    // Surface async failures on the page instead of a silent blank.
    window.addEventListener('error', (e) => show('Error: ' + (e.message || e), true));
    window.addEventListener('unhandledrejection', (e) => show('Error: ' + (e.reason?.message || e.reason), true));

    // --- Preserve the OAuth authorize params across the magic-link round-trip ---
    // Stytch's magic link redirects back to the configured redirect URL and does
    // NOT reliably carry the original query string, so IdentityProvider would lose
    // client_id/redirect_uri/scope/state/code_challenge. We stash them in
    // localStorage the moment a real authorize request arrives, then restore them
    // after authentication. (Click the magic link in the SAME browser — that's
    // where the stash and the new session cookie live.)
    const OAUTH_KEY = 'persistor_oauth_authorize_params';

    // Current query string minus Stytch's magic-link params.
    const oauthParamsFromURL = () => {
      const sp = new URLSearchParams(window.location.search);
      sp.delete('token');
      sp.delete('stytch_token_type');
      return sp;
    };

    // On a fresh authorize request (client_id present), remember the params.
    (() => {
      const sp = oauthParamsFromURL();
      if (sp.get('client_id')) localStorage.setItem(OAUTH_KEY, sp.toString());
    })();

    // Where to send the browser once a session exists: the authorize URL with the
    // OAuth params intact — from the URL if Stytch preserved them, else the stash.
    const authorizeReturnURL = () => {
      let sp = oauthParamsFromURL();
      if (!sp.get('client_id')) {
        const saved = localStorage.getItem(OAUTH_KEY);
        if (saved) sp = new URLSearchParams(saved);
      }
      const qs = sp.toString();
      return window.location.origin + window.location.pathname + (qs ? '?' + qs : '');
    };

    try {
      const stytch = new StytchUIClient('{{.PublicToken}}');

      // Detects the magic-link redirect (?token=...&stytch_token_type=magic_links),
      // authenticates it into a session, then reloads with the OAuth params intact.
      function TokenAuthenticator({ children }) {
        const client = useStytch();
        const { user } = useStytchUser();
        React.useEffect(() => {
          if (!client || user) return;
          const qp = new URLSearchParams(window.location.search);
          const token = qp.get('token');
          const tokenType = qp.get('stytch_token_type');
          if (token && tokenType === 'magic_links') {
            show('Signing you in…');
            client.magicLinks
              .authenticate(token, { session_duration_minutes: 60 })
              .then(() => { window.location.href = authorizeReturnURL(); })
              .catch((err) => show('Sign-in failed: ' + (err?.message || err), true));
          }
        }, [client, user]);
        return children;
      }

      function App() {
        const { user } = useStytchUser();
        React.useEffect(() => {
          show(user ? '' : 'Sign in to approve access to your Persistor memory.');
          // Session established and authorize params are back in the URL — the
          // round-trip succeeded, so the stash has served its purpose.
          if (user && oauthParamsFromURL().get('client_id')) localStorage.removeItem(OAUTH_KEY);
        }, [user]);
        if (user) {
          return h(IdentityProvider);
        }
        // Bare authorize URL — matches the Stytch redirect-URL allowlist exactly.
        // The OAuth params ride through the round-trip via localStorage instead.
        const here = window.location.origin + window.location.pathname;
        const config = {
          products: [Products.emailMagicLinks],
          emailMagicLinksOptions: {
            loginRedirectURL: here,
            loginExpirationMinutes: 60,
            signupRedirectURL: here,
            signupExpirationMinutes: 60,
          },
        };
        return h(StytchLogin, { config });
      }

      createRoot(document.getElementById('root')).render(
        h(StytchProvider, { stytch }, h(TokenAuthenticator, null, h(App))),
      );
    } catch (err) {
      show('Setup failed: ' + (err?.message || err), true);
    }
  </script>
</body>
</html>
